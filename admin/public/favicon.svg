<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140F0B"/>
      <stop offset="50%" stop-color="#24180F"/>
      <stop offset="100%" stop-color="#0D0A07"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>
    <linearGradient id="glowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FDBA74" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#EA580C" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="128" fill="none" stroke="url(#glowBorder)" stroke-width="12"/>

  <!-- Center Starpix "S" Graphic with Glow -->
  <g filter="url(#shadow)">
    <!-- Stylized "S" Path -->
    <path d="M 330 160 C 330 115 290 100 256 100 C 200 100 160 135 160 190 C 160 270 330 260 330 335 C 330 395 285 412 256 412 C 190 412 150 365 150 315" 
          fill="none" 
          stroke="url(#orangeGrad)" 
          stroke-width="64" 
          stroke-linecap="round"/>
  </g>

  <!-- Top Right Sparkle Star Accent -->
  <path d="M 390 110 L 400 135 L 425 145 L 400 155 L 390 180 L 380 155 L 355 145 L 380 135 Z" fill="#FDBA74"/>
</svg>
